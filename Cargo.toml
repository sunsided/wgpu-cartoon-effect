[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "EUPL-1.2"
repository = "https://github.com/sunsided/wgpu-cartoon-effect"

[workspace.dependencies]
fx = { path = "crates/fx" }
fx-wasm = { path = "crates/fx-wasm" }
wgpu = "30.0.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
log = "0.4.35"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
pollster = "1.0.1"
rotated-grid = "1.1.0"
anyhow = "1.0.104"
env_logger = "0.11.11"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
js-sys = "0.3.107"
console_error_panic_hook = "0.1.7"

[profile.release]
lto = "thin"

[workspace.lints.clippy]
# Modules are `foo.rs` + `foo/`, never `foo/mod.rs`.
mod_module_files = "deny"
